# Build the static site (no dependencies) and publish it to GitHub Pages on every push to main.
# Own domain later: repository variables SITE_URL (https://domain), BASE (empty), INDEXABLE=1.
name: Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  BASE: ${{ vars.BASE != null && vars.BASE || format('/{0}', github.event.repository.name) }}
  INDEX: ${{ vars.INDEXABLE || '0' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node build.mjs
      - run: node qa/static-check.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
